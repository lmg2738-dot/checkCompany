# Vercel Cron 백업 — 매일 10시(KST) 전후 일일 리포트 메일
# (화면 메일발송과 동일 API, 최대 10분 대기)
name: Daily risk report email

on:
  schedule:
    # 01:00 UTC = 10:00 KST
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger email via production API
        env:
          APP_URL: ${{ vars.APP_URL || 'https://check-company.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="${APP_URL%/}/jobs/daily-risk-email?run=1&format=json"
          echo "GET $URL"
          AUTH=()
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          curl -fsS "${AUTH[@]}" --max-time 600 -o /tmp/email-job.json "$URL"
          echo "--- response ---"
          cat /tmp/email-job.json
          python3 -c "import json,sys; d=json.load(open('/tmp/email-job.json')); sys.exit(0 if d.get('ok') else 1)"
          echo "OK"
