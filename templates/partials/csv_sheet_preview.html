        <div class="csv-preview-stack">
          <div class="csv-preview-head">
            <span class="csv-preview-title">표 미리보기</span>
            <span class="csv-preview-note">전체 : {{ csv_preview.row_count }}건</span>
          </div>
          <div class="table-wrap">
          <div class="csv-preview-scroll">
            <table class="sheet-data-table csv-sheet">
              <thead>
                <tr>
                  {% for h in csv_preview.headers %}
                  <th>{{ h }}</th>
                  {% endfor %}
                </tr>
              </thead>
              <tbody>
                {% for row in csv_preview.rows %}
                <tr>
                  {% for cell in row %}
                  <td>{{ cell }}</td>
                  {% endfor %}
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
          </div>
        </div>
